name: Web Automation Workflow

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Build (without tests)
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Run Tests
        run: ./gradlew test

      - name: Prepare report for publishing
        if: always()
        run: |
          mkdir -p public
          if [ -f reports/cucumber.html ]; then
            cp reports/cucumber.html public/index.html
            cp -f reports/cucumber.json public/ 2>/dev/null || true
          else
            echo "<html><body><h1>No cucumber report was generated</h1></body></html>" > public/index.html
          fi

      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-reports
          path: public

      - name: Deploy to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
