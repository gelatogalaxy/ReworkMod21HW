plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.18.1'
    implementation 'io.cucumber:cucumber-java:7.34.7'
    testImplementation 'io.cucumber:cucumber-junit:7.34.7'
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'


    testImplementation 'io.github.bonigarcia:webdrivermanager:6.3.4'
}

//test {
//    useJUnitPlatform()
//}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

// PERBAIKAN: blok `test` sebelumnya dikomentari, jadi konfigurasi test
// sepenuhnya bergantung pada default Gradle dan hasilnya tidak deterministik.
test {
    // CucumberTest memakai runner JUnit 4 (@RunWith(Cucumber.class)), bukan
    // JUnit Platform. Menyalakan useJUnitPlatform() justru membuat nol test
    // terdeteksi, sehingga di sini dipakai useJUnit().
    useJUnit()
    // PERBAIKAN: tanpa ini Gradle menandai task test UP-TO-DATE saat source
    // tidak berubah, sehingga reports/cucumber.html tidak pernah dibuat ulang
    // dan artifact/GitHub Pages berisi laporan basi.
    outputs.upToDateWhen { false }
    // Log hasil skenario ke console agar kegagalan terlihat di log Actions.
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}
